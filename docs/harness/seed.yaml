name: cross-repo-time-cd-149
status: approved
version: 2
task_id: "20261121-144622-149a"
# gh-loop worker Stage 2에 따라 이슈 #149 본문(실측 표, 범위 1~4, AC 4개, 범위 밖)을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(read-path-mutation-targets-152)는 git 이력에 보존합니다.
# v1(로컬 커밋 6f1afa9, 푸시하지 않음)은 "실행됐는지 확신할 수 없는 cd는 두 디렉터리를 모두 판정한다"는 AC5를 더했습니다.
# 그 후보 모델은 리뷰 4라운드(r1 PASS WITH NOTES, r2~r4 FAIL)에서 매번 새 회귀를 냈고, 사용자 결정 B
# (2026-11-24, session-decision nonce 1795430663-26709)로 범위를 이슈 원문으로 줄였습니다. v2는 새 main(f660c3c) 위에서 다시 씁니다.
goal: >
  #149: cross-repo 가드(#15 ②)가 `time cd <다른 리포> && git commit`을 차단하게 하고,
  CDPATH가 걸린 상대 cd의 판정을 실측으로 정해 테스트와 통합 계약에 고정합니다.
  이슈 표의 거짓 차단 두 형태는 그대로 두고, 실행되지 않은 cd가 만드는 역방향 우회는 실측해 계약 잔존면에 적습니다.
constraints:
  - "판정 불가는 fail-closed로 두는 #15의 원칙을 유지합니다. 이전에 차단되던 형태를 통과시키면 안 됩니다 — 커밋·푸시(②)와 파일 변경(①) 양쪽 모두."
  - "가드가 추적하는 cwd와 ① 레일의 귀속 규칙은 바꾸지 않습니다. `time` 뒤 cwd 이동과 CDPATH 상대 cd는 '이후 커밋·푸시는 판정 불가'만 더합니다(사용자 결정 B)."
  - "셸의 실제 동작은 추측하지 않고 bash 실측(픽스처 리포에서 커밋이 어디에 떨어지는지)으로 확인합니다."
  - "`commitTargetDir`·`verificationCwd`의 공개 시그니처와 #111이 정한 동작(선행 리터럴 cd 1회 추적)은 유지합니다."
  - "같은 배치의 다른 워커가 `harness-harness_integration_contract.md`·`docs/harness/audit.jsonl`·`CHANGELOG.md`를 함께 고치므로 이 이슈가 다루는 줄만 고칩니다(계약: cross-repo 가드 설명 한 구절, cross-repo 잔존면 한 구절과 새 항목 하나, HEAD 스냅샷 잔존면의 해당 구절; CHANGELOG `[Unreleased]` 한 항목)."
  - "계약 문구에 아직 없는 후속 이슈 번호를 적지 않습니다(후속 이슈는 #149가 닫힌 뒤 코디네이터가 만듭니다)."
  - "버전 범프·태그·머지·force-push는 하지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "`time cd <다른 하네스 리포> && git commit -m x`가 BLOCK됩니다(RED→GREEN 회귀 테스트, `tests/cross-repo.test.mjs`)."
  - id: AC2
    title: "이슈 실측 표의 나머지 다섯 형태의 판정이 테스트로 고정되고, 거짓 차단 두 형태는 그대로 둡니다(근거는 PR과 계약 문서에 적습니다)."
  - id: AC3
    title: "`CDPATH`가 걸린 상대 `cd`의 실측 결과와 판정(fail-closed)이 계약 문서에 적히고, 판정이 테스트로 고정됩니다."
  - id: AC4
    title: "`node --test .omp/extensions/harness/tests/*.test.mjs` 전 항목과 `node scripts/docs-drift`가 통과합니다."
out_of_scope:
  - "임의 셸 구문의 완전한 해석(서브셸·함수·`eval`) — 이슈 본문의 범위 밖입니다."
  - "#111의 범위(CoW 워크트리 상태 격리, `commitTargetDir` 정합화)."
  - "실행되지 않은 `cd`의 역방향 우회(bash 도구 `cwd`가 다른 리포일 때 `cd <세션 리포> | cat; git commit` 등)를 닫는 것 — 실측해 계약 잔존면에 적고 후속 이슈로 넘깁니다(사용자 결정 B). v1의 후보 모델(AC5)이 이것이었습니다."
  - "`time cd` 뒤와 CDPATH 상대 `cd` 뒤의 ① 레일 귀속을 고치는 것 — 이전과 같은 귀속(떠난 디렉터리 / `<cwd>/<dir>`)을 유지하고 잔존면으로 적습니다."
  - "거짓 차단을 줄이는 것(`time cd <세션 리포 안>`, `\\time`·`command time`, 빈 `CDPATH=`, `unset CDPATH`)."
assumptions:
  - "시작 HEAD는 main f660c3c(PR #154 머지 뒤)이고 `gates/git-commit-detect.mjs`·`gates/cross-repo.mjs`는 ea9a9c3 이후 변경이 없습니다."
  - "실측 셸은 GNU bash 5.2.21(WSL)입니다. omp bash 도구의 셸도 bash 문법을 따른다고 봅니다."
risks:
  - "`time` 뒤 cwd 이동과 CDPATH 상대 `cd`는 대상을 따라가지 않으므로, 실제로는 세션 리포에 떨어지는 커밋도 차단됩니다(거짓 차단 — 안전한 방향)."
  - "omp 프로세스가 `CDPATH`를 export한 채 뜨면 `cd sub && git commit`이 판정 불가로 차단됩니다 — `cd ./sub`로 쓰거나 호출 env에 `CDPATH: ''`를 넘겨야 합니다."
  - "역방향 우회와 ① 레일의 `time cd`·CDPATH 귀속은 닫히지 않은 채 남습니다(계약 잔존면에 실측과 함께 기록)."
  - "이 세션에 로드된 확장은 옛 코드입니다 — 실제 가드 동작은 핸들러·단위 테스트와 실측 스크립트로 검증하고, 새 세션부터 적용됩니다."
